<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Core Surge - Page Not Found</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #08101c;
      color: #e0e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .container { max-width: 420px; }
    .code {
      font-size: 5rem;
      font-weight: 900;
      background: linear-gradient(135deg, #00e5ff, #7c4dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 1rem;
      color: #b0bec5;
    }
    p {
      color: #78909c;
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    a {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: linear-gradient(135deg, #00e5ff, #7c4dff);
      color: #08101c;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      transition: opacity 0.2s;
    }
    a:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1>Signal Lost</h1>
    <p>The core you're looking for doesn't exist in this sector. Return to base and defend what matters.</p>
    <a href="/">Return to Base</a>
  </div>
</body>
</html>
