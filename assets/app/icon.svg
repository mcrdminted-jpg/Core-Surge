<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14253d"/>
      <stop offset="100%" stop-color="#060b13"/>
    </linearGradient>
    <linearGradient id="hex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b36cff"/>
      <stop offset="100%" stop-color="#5925b8"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe37c"/>
      <stop offset="100%" stop-color="#ff782d"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00f0ff" stroke-width="26" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="120" fill="#162847"/>
  <polygon points="256,128 367,192 367,320 256,384 145,320 145,192" fill="url(#hex)"/>
  <circle cx="256" cy="256" r="48" fill="url(#core)"/>
  <circle cx="244" cy="240" r="10" fill="#ffffff" opacity="0.95"/>
</svg>
