      <stop offset="0%" stop-color="#07101c"/>
      <stop offset="100%" stop-color="#030711"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#0fdfff" stop-opacity="0.38"/>
      <stop offset="48%" stop-color="#0fdfff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0fdfff" stop-opacity="0"/>
